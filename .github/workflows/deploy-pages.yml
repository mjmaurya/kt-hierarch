name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'projects/kt-hierarch-demo/**'
      - 'projects/kt-hierarch/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build demo
        run: npm run build:demo

      - name: Add SPA fallback
        run: cp dist/kt-hierarch-demo/index.html dist/kt-hierarch-demo/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/kt-hierarch-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
