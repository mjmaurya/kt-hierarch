name: Publish kt-hierarch to npm

on:
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version
        id: version
        run: |
          cd projects/kt-hierarch
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build library
        run: npm run build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/kt-hierarch/package.json
          git commit -m "chore(release): kt-hierarch ${{ steps.version.outputs.version }} [skip ci]"
          git tag "kt-hierarch-${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git push origin "kt-hierarch-${{ steps.version.outputs.version }}"

      - name: Publish to npm
        run: npm publish
        working-directory: dist/kt-hierarch
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
