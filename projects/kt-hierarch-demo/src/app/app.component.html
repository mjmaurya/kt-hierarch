<div class="shell">
  <header class="topbar">
    <span class="brand">kt-hierarch</span>
    <nav class="tabs" role="tablist">
      <button
        *ngFor="let tab of tabs"
        type="button"
        role="tab"
        class="tab"
        [class.active]="active === tab.id"
        [attr.aria-selected]="active === tab.id"
        (click)="select(tab.id)"
      >
        {{ tab.label }}
      </button>
    </nav>
  </header>

  <!-- [hidden] rather than *ngIf so each playground keeps its edits when switching tabs -->
  <div class="tab-panel" role="tabpanel" [hidden]="active !== 'hierarchy'">
    <app-hierarchy-playground></app-hierarchy-playground>
  </div>
  <div class="tab-panel" role="tabpanel" [hidden]="active !== 'dependency-graph'">
    <app-dependency-graph-playground></app-dependency-graph-playground>
  </div>
</div>
